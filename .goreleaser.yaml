version: 2

project_name: openfga

before:
  hooks:
    - make generate-mocks

builds:
  -
    main: ./cmd/openfga
    binary: openfga
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - "-s -w"
      - "-X github.com/openfga/openfga/internal/build.Version=v{{ .Version }}"
      - "-X github.com/openfga/openfga/internal/build.Commit={{.Commit}}"
      - "-X github.com/openfga/openfga/internal/build.Date={{.Date}}"
      - "-X github.com/openfga/openfga/internal/build.ProjectName={{.ProjectName}}"

release:
  github:
    owner: humandi
    name: openfga-openfga

archives:
  - files:
      - assets

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
